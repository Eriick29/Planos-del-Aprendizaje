<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="900" height="420" fill="#ffffff"/>

  <!-- Ruido -->
  <rect x="330" y="15" width="240" height="75" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="450" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#991b1b">RUIDO</text>
  <text x="450" y="68" text-anchor="middle" font-size="13" fill="#991b1b">Internet, audio, distracciones, ambigüedad</text>
  <line x1="450" y1="90" x2="450" y2="148" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrowRed)"/>
  <text x="462" y="124" font-size="13" fill="#dc2626">interfiere</text>

  <!-- Emisor -->
  <rect x="30" y="150" width="210" height="90" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="135" y="188" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e3a8a">EMISOR</text>
  <text x="135" y="212" text-anchor="middle" font-size="13" fill="#1e3a8a">Docente / Grupo</text>

  <!-- Canal -->
  <rect x="345" y="150" width="210" height="90" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="450" y="188" text-anchor="middle" font-size="20" font-weight="bold" fill="#713f12">CANAL</text>
  <text x="450" y="212" text-anchor="middle" font-size="13" fill="#713f12">Moodle, Meet, WhatsApp, GitHub</text>

  <!-- Receptor -->
  <rect x="660" y="150" width="210" height="90" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="765" y="188" text-anchor="middle" font-size="20" font-weight="bold" fill="#14532d">RECEPTOR</text>
  <text x="765" y="212" text-anchor="middle" font-size="13" fill="#14532d">Estudiantes</text>

  <!-- Flechas principales -->
  <line x1="240" y1="195" x2="343" y2="195" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="292" y="185" text-anchor="middle" font-size="12" fill="#1f2937">Mensaje</text>
  <line x1="555" y1="195" x2="658" y2="195" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="607" y="185" text-anchor="middle" font-size="12" fill="#1f2937">Mensaje</text>

  <!-- Retroalimentación -->
  <rect x="345" y="320" width="210" height="80" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="450" y="355" text-anchor="middle" font-size="18" font-weight="bold" fill="#581c87">RETROALIMENTACIÓN</text>
  <text x="450" y="378" text-anchor="middle" font-size="13" fill="#581c87">Preguntas, foros, entregas</text>

  <path d="M765,240 L765,360 L557,360" fill="none" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M343,360 L135,360 L135,242" fill="none" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
